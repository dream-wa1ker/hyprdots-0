    community_ids = [
        "zen-browser",
        "inkscape",
        "libreoffice",
        "neovim",
        "obsidian",
        "zed",
        "fuzzel",
        "fastfetch",
        "papirus-icons",
        "bat",
        "fzf",
        "konsole",
        "tmux"
