offset_x = 10
offset_y = 10

[plugin_settings."alexander/screen-toolkit"]
hide-cursor = false
panel-mode = "legacy"
record-audio-in = true
record-audio-out = true
record-skip-confirmation = true
share-skip-popover = true
video-path = "/home/rev/Videos/Recordings"

[plugin_settings."kenn/keybind-cheatsheet"]
