[plugin_settings."yuuto/arch-updater"]
panel_placement = "floating"
panel_position = "center"

[plugins]
enabled = [
    "dotnetrob/cat",
    "liamwh/emoji-picker",
    "fel/ocr",
    "kenn/keybind-cheatsheet",
    "yuuto/arch-updater",
    "thepunkoff/pomodoro",
    "jamesfeeder/special-workspaces"
]

[shell]
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.panel]
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    freeze_screen = false
    show_cursor = true

[theme]
